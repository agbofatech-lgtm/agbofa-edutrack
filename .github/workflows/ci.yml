name: Engineering checks

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Type check
        working-directory: frontend
        run: npm run typecheck
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Format check
        working-directory: frontend
        run: npm run format:check
      - name: Unit and accessibility-contract tests
        working-directory: frontend
        run: npm test
      - name: Production build
        working-directory: frontend
        run: npm run build

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: edutrack_test
          POSTGRES_USER: edutrack_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U edutrack_test -d edutrack_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONPATH: backend
      DJANGO_SETTINGS_MODULE: config.settings.ci_postgres
      EDUTRACK_CI_TEST_DATABASE_URL: postgresql://edutrack_test@127.0.0.1:5432/edutrack_test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements/dev.txt
      - name: Install backend development dependencies
        run: python -m pip install -r backend/requirements/dev.txt
      - name: Django system checks
        run: python backend/manage.py check
      - name: Backend and authentication/RBAC tests
        run: pytest backend
      - name: Python lint and format
        working-directory: backend
        run: |
          ruff check .
          ruff format --check .
      - name: Python type check
        working-directory: backend
        run: mypy config core identity institutional
      - name: CI, Compose and Railway configuration validation
        run: python scripts/validate_config.py

  security:
    name: Secret and dependency review
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository for source secret scan
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Audit frontend dependency tree
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=high
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Audit backend dependency tree
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements/dev.txt
          pip-audit -r backend/requirements/dev.txt
      - name: Scan source files for secret-like values
        run: git ls-files -co --exclude-standard -z | xargs -0 detect-secrets-hook --json

  dependency-review:
    name: Pull request dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Review dependency changes for advisories
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
